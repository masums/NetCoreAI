name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer needs tags

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore NetCoreAI.slnx

      - name: Build framework
        run: dotnet build NetCoreAI.slnx --no-restore -c Release

      - name: Test framework
        run: dotnet test --solution NetCoreAI.slnx --no-build -c Release --results-directory artifacts/test-results

      - name: Pack framework
        run: dotnet pack NetCoreAI.slnx --no-build -c Release -o artifacts/packages

      - name: Build samples against local feed
        run: dotnet build samples/NetCoreAI.Samples.slnx -c Release

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.nupkg

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results

  model-tests:
    # Nightly: runs the Category=Model conformance tests with real GGUF/ONNX fixtures.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      NETCOREAI_TEST_MODELS: "1"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - run: dotnet test --solution NetCoreAI.slnx -c Release -- --filter-trait "Category=Model"
